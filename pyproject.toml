[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mustachar"
version = "0.1.0"
description = "AI-powered Arabic legal assistant with real-time voice streaming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "edge-tts>=6.1.12",
    "groq>=0.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mustachar"]

# ── Ruff ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "RUF001", # ambiguous Unicode — false positive on Arabic text (this is an Arabic project)
]

[tool.ruff.lint.isort]
known-first-party = ["mustachar"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "edge_tts.*",
    "groq.*",
    "numpy.*",
    "structlog.*",
]
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
